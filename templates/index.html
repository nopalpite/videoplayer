<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur vidéo</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --border: #e3e6ea; --text: #1d2228;
    --muted: #6b7480; --accent: #2563eb; --ok: #16a34a; --warn: #b45309;
    --err: #dc2626; --soft: #f0f2f5; --warn-bg: #fef3c7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --border: #2a313a; --text: #e6e9ed;
      --muted: #8b95a1; --soft: #222831; --warn: #f59e0b; --warn-bg: #3b2f0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    justify-content: space-between; padding: 16px 24px;
    border-bottom: 1px solid var(--border); background: var(--card);
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  h3 { font-size: 13px; font-weight: 600; margin: 20px 0 10px; color: var(--muted);
       text-transform: uppercase; letter-spacing: .04em; }
  main { max-width: 900px; margin: 24px auto 96px; padding: 0 16px;
         display: grid; gap: 16px; }
  section { background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; padding: 20px; }

  .now { display: flex; align-items: center; gap: 10px; color: var(--muted); min-width: 0; }
  .now b { color: var(--text); font-weight: 600; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--err); }
  .bar { width: 120px; height: 4px; border-radius: 2px; background: var(--soft);
         overflow: hidden; flex: none; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent);
             transition: width 1s linear; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
         overflow: hidden; margin-bottom: 18px; }
  .seg button { font: inherit; padding: 8px 16px; border: 0; background: transparent;
                color: var(--muted); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--accent); color: #fff; }

  .field { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px;
           align-items: center; margin-bottom: 12px; }
  .field > label:first-child { color: var(--muted); }
  select, input[type=range] { font: inherit; }
  select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--bg); color: var(--text); max-width: 100%; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }

  button.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
               border: 1px solid var(--border); background: var(--card);
               color: var(--text); cursor: pointer; }
  button.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.1); }
  button.btn.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px;
       padding: 0 8px 8px; }
  td { padding: 8px; border-top: 1px solid var(--border); vertical-align: middle; }
  td.actions { text-align: right; white-space: nowrap; }
  td.actions .btn + .btn { margin-left: 6px; }
  tr.playing td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .empty { color: var(--muted); padding: 14px 8px; }

  .drop { display: block; border: 1.5px dashed var(--border); border-radius: 8px; padding: 18px;
          text-align: center; color: var(--muted); margin-bottom: 16px; cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .upload { display: flex; gap: 10px; align-items: center; font-size: 12px;
            margin-bottom: 8px; }
  .upload .bar { width: 160px; }
  .job { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
         align-items: center; padding: 10px 12px; margin-bottom: 8px;
         border: 1px solid var(--border); border-radius: 8px; }
  .job .bar { width: 100%; grid-column: 1; }
  .job .state { color: var(--muted); font-size: 12px; }
  .job.error .state { color: var(--err); }
  .job.done .state { color: var(--ok); }
  .job .actions { grid-column: 2; grid-row: 1 / span 3; display: flex; gap: 6px; }
  .kind { font: 600 10px ui-monospace, monospace; padding: 2px 5px; border-radius: 4px;
          background: var(--soft); color: var(--muted); }
  .name { font-weight: 500; word-break: break-all; }
  .info { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .warn { color: var(--warn); font-size: 12px; margin-top: 2px; }
  .subsel { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .subsel select { font-size: 12px; padding: 3px 6px; margin-left: 4px; }

  .savebar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px;
             background: var(--card); border-top: 1px solid var(--border);
             display: flex; justify-content: flex-end; align-items: center; gap: 16px;
             transform: translateY(100%); transition: transform .15s; }
  .savebar.show { transform: none; }
  .errors { color: var(--err); font-size: 13px; flex: 1; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 8px 16px;
           border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s;
           pointer-events: none; }
  .toast.show { opacity: 1; }
  .alert { background: var(--warn-bg); color: var(--warn); padding: 8px 12px;
           border-radius: 6px; font-size: 13px; margin-bottom: 14px; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    header, .savebar { padding: 12px 16px; }
    section { padding: 16px; }
    .field { grid-template-columns: 1fr; gap: 6px; }
    .bar { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Lecteur vidéo</h1>
  <div class="now">
    <span class="dot" id="dot"></span>
    <span id="now">…</span>
    <span class="bar" id="progress" hidden><i></i></span>
  </div>
</header>

<main>
  <section>
    <h2>Mode de lecture</h2>
    <div class="alert" id="player-error" hidden></div>
    <div class="seg" id="mode">
      <button data-mode="loop">Boucle simple</button>
      <button data-mode="interactive">Interactif (boutons)</button>
    </div>

    <div id="panel-loop">
      <div class="field">
        <label for="loop-media">Média en boucle</label>
        <select id="loop-media"></select>
      </div>
      <label class="check"><input type="checkbox" id="loop-sound"> Avec le son</label>
    </div>

    <div id="panel-interactive">
      <div class="field">
        <label for="attract">Accroche (en boucle)</label>
        <select id="attract"></select>
      </div>
      <label class="check"><input type="checkbox" id="attract-sound"> Son de l'accroche</label>
      <label class="check"><input type="checkbox" id="triggers-sound"> Son des vidéos déclenchées</label>
      <label class="check"><input type="checkbox" id="interruptible">
        Un appui interrompt la vidéo en cours</label>
      <p class="hint" id="interruptible-hint"></p>

      <h3>Boutons</h3>
      <div class="field">
        <label for="wiring">Câblage</label>
        <select id="wiring">
          <option value="low">Bouton entre GPIO et GND (pull-up interne)</option>
          <option value="high">Bouton entre GPIO et 3V3 (pull-down interne)</option>
        </select>
      </div>
      <table>
        <thead><tr><th>Entrée</th><th>Vidéo lancée</th><th></th></tr></thead>
        <tbody id="triggers"></tbody>
      </table>
      <p style="margin:12px 0 0">
        <button class="btn" id="add-trigger">+ Ajouter un bouton</button>
      </p>
    </div>

    <h3>Son</h3>
    <div class="field">
      <label for="volume">Volume <span id="volume-val"></span></label>
      <input type="range" id="volume" min="0" max="100" step="5">
    </div>
    <div class="field">
      <label for="audio-device">Sortie audio</label>
      <select id="audio-device"></select>
    </div>

    <h3>Sous-titres</h3>
    <div class="field">
      <label for="sub-size">Taille</label>
      <select id="sub-size">
        <option value="small">Petite</option>
        <option value="medium">Moyenne</option>
        <option value="large">Grande</option>
      </select>
    </div>
    <label class="check"><input type="checkbox" id="sub-background">
      Fond sombre derrière le texte (meilleure lisibilité)</label>
    <p class="hint">Associez un fichier .srt à une vidéo depuis la médiathèque.</p>
  </section>

  <section>
    <h2>Médiathèque</h2>
    <label class="drop" id="drop">
      Glissez des vidéos, images ou sous-titres (.srt) ici, ou <u>parcourez</u><br>
      <small>Les vidéos sont converties automatiquement pour une lecture fluide
        sur le Pi (H.264, résolution et cadence d'origine conservées).</small>
      <input type="file" id="file" multiple hidden
             accept="video/*,image/*,.mkv,.mov,.m4v,.ts,.srt,.vtt,.ass">
    </label>
    <div id="uploads"></div>
    <div id="jobs"></div>
    <table>
      <tbody id="media"></tbody>
    </table>
  </section>
</main>

<div class="savebar" id="savebar">
  <span class="errors" id="errors"></span>
  <button class="btn" id="cancel">Annuler</button>
  <button class="btn primary" id="save">Enregistrer et appliquer</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let saved = null;   // configuration enregistrée
let cfg = null;     // configuration en cours d'édition
let media = [], gpios = [], player = null, jobs = [];

const fmtSize = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + " Go"
  : b > 1e6 ? (b / 1e6).toFixed(0) + " Mo" : Math.ceil(b / 1e3) + " ko";
const fmtTime = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const clone = (o) => JSON.parse(JSON.stringify(o));
const dirty = () => JSON.stringify(cfg) !== JSON.stringify(saved);

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2500);
}

function fillSelect(sel, items, value, placeholder) {
  sel.innerHTML = "";
  if (placeholder) sel.add(new Option(placeholder, ""));
  for (const [val, label] of items) sel.add(new Option(label, val));
  if (value && !items.some(([v]) => v === value)) sel.add(new Option(`${value} (manquant)`, value));
  sel.value = value ?? "";
}

const mediaOptions = (kinds) => media
  .filter((m) => kinds.includes(m.kind))
  .map((m) => [m.name, m.kind === "image" ? `${m.name}  (image)` : m.name]);

// --- rendu du formulaire ---------------------------------------------------

function render() {
  for (const b of $("mode").children) b.classList.toggle("on", b.dataset.mode === cfg.mode);
  $("panel-loop").hidden = cfg.mode !== "loop";
  $("panel-interactive").hidden = cfg.mode !== "interactive";

  fillSelect($("loop-media"), mediaOptions(["video", "image"]), cfg.loop.media, "— choisir —");
  $("loop-sound").checked = !cfg.loop.muted;

  const it = cfg.interactive;
  fillSelect($("attract"), mediaOptions(["video", "image"]), it.attract, "— écran noir —");
  $("attract-sound").checked = !it.attract_muted;
  $("triggers-sound").checked = !it.triggers_muted;
  $("interruptible").checked = it.interruptible;
  $("interruptible-hint").textContent = it.interruptible
    ? "Pendant une vidéo, un nouvel appui lance immédiatement la vidéo du bouton pressé."
    : "Pendant une vidéo, les appuis sont ignorés jusqu'au retour à l'accroche.";
  $("wiring").value = it.active_low ? "low" : "high";
  renderTriggers();

  $("volume").value = cfg.volume;
  $("volume-val").textContent = `(${cfg.volume} %)`;
  const devices = (player?.audio_devices || []).map((d) => [d.name, d.description]);
  if (!devices.length) devices.push(["auto", "Automatique"]);
  fillSelect($("audio-device"), devices, cfg.audio_device);

  $("sub-size").value = cfg.subtitle_style.size;
  $("sub-background").checked = cfg.subtitle_style.background;

  renderMedia();
  $("savebar").classList.toggle("show", dirty());
}

function renderTriggers() {
  const body = $("triggers");
  body.innerHTML = "";
  const used = cfg.interactive.triggers.map((t) => t.gpio);
  const videos = mediaOptions(["video"]);
  const savedGpios = saved.mode === "interactive"
    ? saved.interactive.triggers.map((t) => t.gpio) : [];

  cfg.interactive.triggers.forEach((t, i) => {
    const tr = document.createElement("tr");
    if (player?.state === "triggered" && player.gpio === t.gpio) tr.className = "playing";

    const gpioSel = document.createElement("select");
    const choices = gpios
      .filter((g) => g.gpio === t.gpio || !used.includes(g.gpio))
      .map((g) => [String(g.gpio), `GPIO${g.gpio} · broche ${g.pin}`]);
    fillSelect(gpioSel, choices, String(t.gpio));
    gpioSel.onchange = () => { t.gpio = +gpioSel.value; render(); };

    const mediaSel = document.createElement("select");
    fillSelect(mediaSel, videos, t.media, "— choisir une vidéo —");
    mediaSel.onchange = () => { t.media = mediaSel.value || null; render(); };

    const test = document.createElement("button");
    test.className = "btn";
    test.textContent = "Tester";
    test.title = "Simule un appui (configuration enregistrée)";
    test.disabled = dirty() || !savedGpios.includes(t.gpio);
    test.onclick = () => fetch(`/api/trigger/${t.gpio}`, { method: "POST" });

    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Retirer";
    del.onclick = () => { cfg.interactive.triggers.splice(i, 1); render(); };

    const cells = [gpioSel, mediaSel, [test, del]];
    for (const c of cells) {
      const td = document.createElement("td");
      if (Array.isArray(c)) { td.className = "actions"; td.append(...c); } else td.append(c);
      tr.append(td);
    }
    body.append(tr);
  });

  if (!cfg.interactive.triggers.length) {
    body.innerHTML = `<tr><td colspan="3" class="empty">Aucun bouton configuré.</td></tr>`;
  }
  $("add-trigger").disabled = !gpios.some((g) => !used.includes(g.gpio));
}

function subtitleSelect(video) {
  const label = document.createElement("label");
  label.className = "subsel";
  label.textContent = "Sous-titres :";
  const sel = document.createElement("select");
  const subs = media.filter((m) => m.kind === "subtitle").map((m) => [m.name, m.name]);
  fillSelect(sel, subs, cfg.subtitles[video] || "", "aucun");
  sel.disabled = !subs.length && !cfg.subtitles[video];
  sel.onchange = () => {
    if (sel.value) cfg.subtitles[video] = sel.value;
    else delete cfg.subtitles[video];
    render();
  };
  label.append(sel);
  return label;
}

// Associe automatiquement un .srt envoyé à la vidéo du même nom (à enregistrer)
function autoAssociate(subName) {
  const stem = subName.replace(/\.[^.]+$/, "");
  const video = media.find((m) => m.kind === "video" && m.name.replace(/\.[^.]+$/, "") === stem);
  if (video && !cfg.subtitles[video.name]) {
    cfg.subtitles[video.name] = subName;
    toast(`${subName} associé à ${video.name} : pensez à enregistrer`);
  }
}

function renderMedia() {
  const body = $("media");
  body.innerHTML = "";
  if (!media.length) {
    body.innerHTML = `<tr><td class="empty">Aucun média. Ajoutez une vidéo ou une image.</td></tr>`;
    return;
  }
  for (const m of media) {
    const tr = document.createElement("tr");
    if (player?.media === m.name) tr.className = "playing";
    const info = [];
    if (m.width) info.push(`${m.width}×${m.height}`);
    if (m.kind === "video" && m.codec) info.push(m.codec);
    if (m.duration) info.push(fmtTime(m.duration));
    if (m.kind === "video") info.push(m.audio ? "avec son" : "sans piste audio");
    if (m.kind === "subtitle") info.push(`${m.cues} répliques`);
    info.push(fmtSize(m.size));

    const td = document.createElement("td");
    td.innerHTML = `<span class="kind"></span> <span class="name"></span>
      <div class="info"></div>`;
    td.querySelector(".kind").textContent =
      { video: "VIDÉO", image: "IMAGE", subtitle: "SOUS-TITRES" }[m.kind];
    td.querySelector(".name").textContent = m.name;
    td.querySelector(".info").textContent = info.join(" · ");
    for (const w of m.warnings) {
      const d = document.createElement("div");
      d.className = "warn";
      d.textContent = "⚠ " + w;
      td.append(d);
    }
    if (m.kind === "video") td.append(subtitleSelect(m.name));

    const act = document.createElement("td");
    act.className = "actions";
    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Supprimer";
    del.onclick = () => deleteMedia(m.name);
    act.append(del);
    tr.append(td, act);
    body.append(tr);
  }
}

// --- évènements du formulaire -----------------------------------------------

$("mode").onclick = (e) => {
  if (e.target.dataset.mode) { cfg.mode = e.target.dataset.mode; render(); }
};
const bind = (id, fn) => $(id).addEventListener("change", (e) => { fn(e.target); render(); });
bind("loop-media", (el) => cfg.loop.media = el.value || null);
bind("loop-sound", (el) => cfg.loop.muted = !el.checked);
bind("attract", (el) => cfg.interactive.attract = el.value || null);
bind("attract-sound", (el) => cfg.interactive.attract_muted = !el.checked);
bind("triggers-sound", (el) => cfg.interactive.triggers_muted = !el.checked);
bind("interruptible", (el) => cfg.interactive.interruptible = el.checked);
bind("wiring", (el) => cfg.interactive.active_low = el.value === "low");
bind("audio-device", (el) => cfg.audio_device = el.value);
bind("sub-size", (el) => cfg.subtitle_style.size = el.value);
bind("sub-background", (el) => cfg.subtitle_style.background = el.checked);
$("volume").oninput = (e) => { cfg.volume = +e.target.value; render(); };

$("add-trigger").onclick = () => {
  const used = cfg.interactive.triggers.map((t) => t.gpio);
  const free = gpios.find((g) => !used.includes(g.gpio));
  if (free) cfg.interactive.triggers.push({ gpio: free.gpio, media: null });
  render();
};

$("cancel").onclick = () => { cfg = clone(saved); $("errors").textContent = ""; render(); };

$("save").onclick = async () => {
  const r = await fetch("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cfg),
  });
  const data = await r.json();
  if (!r.ok) { $("errors").textContent = data.errors.join(" · "); return; }
  $("errors").textContent = "";
  await load();
  toast("Configuration appliquée");
};

// --- médiathèque ---------------------------------------------------------------

async function deleteMedia(name) {
  if (!confirm(`Supprimer « ${name} » ?`)) return;
  const r = await fetch(`/api/media/${encodeURIComponent(name)}`, { method: "DELETE" });
  if (!r.ok) { toast((await r.json()).error); return; }
  await refreshMedia();
}

function upload(file) {
  const row = document.createElement("div");
  row.className = "upload";
  row.innerHTML = `<span class="bar"><i></i></span><span></span>`;
  row.lastChild.textContent = file.name;
  $("uploads").append(row);

  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", `/api/media/${encodeURIComponent(file.name)}`);
    xhr.upload.onprogress = (e) => {
      row.querySelector("i").style.width = `${(e.loaded / e.total) * 100}%`;
    };
    xhr.onloadend = () => {
      if (xhr.status !== 200) {
        let msg = "échec de l'envoi";
        try { msg = JSON.parse(xhr.responseText).error; } catch {}
        toast(`${file.name} : ${msg}`);
      }
      row.remove();
      refreshMedia().then(() => {
        if (xhr.status === 200 && /\.(srt|vtt|ass)$/i.test(file.name)) {
          autoAssociate(JSON.parse(xhr.responseText).name);
          render();
        }
      });
      resolve();
    };
    xhr.send(file);
  });
}

async function uploadAll(files) {
  for (const f of files) await upload(f);
}

// --- conversions ---------------------------------------------------------------

const fmtEta = (s) => s < 60 ? `${Math.max(1, Math.round(s))} s`
  : `${Math.floor(s / 60)} min ${String(Math.round(s % 60)).padStart(2, "0")}`;

function jobLabel(j) {
  switch (j.state) {
    case "queued": return "En attente de conversion";
    case "analyzing": return "Analyse…";
    case "converting": {
      const pct = Math.floor(j.progress * 100);
      const why = j.reasons.length ? ` (${j.reasons.join(", ")})` : "";
      return `Conversion ${pct} %` + (j.eta != null ? ` · reste ~${fmtEta(j.eta)}` : "") + why;
    }
    case "done": return j.reasons.length && j.reasons[0] !== "conteneur ou audio à adapter"
      ? `Converti (${j.reasons.join(", ")}) · prêt`
      : j.reasons.length ? "Adapté sans réencodage · prêt" : "Déjà optimal · prêt";
    case "error": return `Échec : ${j.error}`;
  }
  return j.state;
}

function renderJobs() {
  const box = $("jobs");
  box.innerHTML = "";
  for (const j of jobs) {
    const row = document.createElement("div");
    row.className = `job ${j.state}`;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = j.original === j.name ? j.name : `${j.original} → ${j.name}`;
    const bar = document.createElement("span");
    bar.className = "bar";
    bar.innerHTML = "<i></i>";
    bar.firstChild.style.width = `${(j.state === "done" ? 1 : j.progress) * 100}%`;
    bar.hidden = !["converting", "done"].includes(j.state);
    const state = document.createElement("span");
    state.className = "state";
    state.textContent = jobLabel(j);
    const btn = document.createElement("button");
    btn.className = "btn";
    const active = !["done", "error"].includes(j.state);
    btn.textContent = active ? "Annuler" : "Masquer";
    btn.onclick = async () => {
      if (active && !confirm(`Annuler la conversion de « ${j.original} » ?`)) return;
      await fetch(`/api/jobs/${j.id}`, { method: "DELETE" });
      poll();
    };
    const actions = document.createElement("div");
    actions.className = "actions";
    if (j.state === "error") {
      const retry = document.createElement("button");
      retry.className = "btn";
      retry.textContent = "Réessayer";
      retry.onclick = async () => {
        await fetch(`/api/jobs/${j.id}/retry`, { method: "POST" });
        poll();
      };
      actions.append(retry);
    }
    actions.append(btn);
    row.append(name, actions, bar, state);
    box.append(row);
  }
}

async function refreshMedia() {
  const data = await (await fetch("/api/state")).json();
  media = data.media;
  gpios = data.gpios;
  jobs = data.jobs;
  render();   // conserve les modifications en cours du formulaire
  renderMedia();
  renderJobs();
}

$("file").onchange = (e) => { uploadAll([...e.target.files]); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  uploadAll([...e.dataTransfer.files]);
};

// --- état du lecteur ---------------------------------------------------------

const STATE_LABEL = {
  loop: "En boucle", attract: "Accroche", triggered: "Vidéo déclenchée",
  idle: "Écran noir",
};

function renderStatus() {
  $("dot").classList.toggle("off", !player);
  const now = $("now");
  const bar = $("progress");
  if (!player) {
    now.textContent = "Lecteur arrêté";
    bar.hidden = true;
    $("player-error").hidden = true;
    return;
  }
  now.innerHTML = "";
  now.append(STATE_LABEL[player.state] || player.state);
  if (player.media) {
    const b = document.createElement("b");
    b.textContent = player.media + (player.gpio != null ? ` (GPIO${player.gpio})` : "");
    now.append(" : ", b);
  }
  const showBar = player.state === "triggered" && player.duration;
  bar.hidden = !showBar;
  if (showBar) bar.firstChild.style.width = `${(player.position / player.duration) * 100}%`;

  $("player-error").hidden = !player.last_error;
  $("player-error").textContent = player.last_error || "";
}

async function load() {
  const data = await (await fetch("/api/state")).json();
  media = data.media;
  gpios = data.gpios;
  player = data.player;
  jobs = data.jobs;
  saved = data.config;
  cfg = clone(saved);
  render();
  renderMedia();
  renderJobs();
  renderStatus();
}

async function poll() {
  try {
    const prev = JSON.stringify([player?.state, player?.media, player?.gpio]);
    const doneBefore = jobs.filter((j) => j.state === "done").map((j) => j.id).join();
    const data = await (await fetch("/api/status")).json();
    player = data.player;
    jobs = data.jobs;
    renderStatus();
    renderJobs();
    if (jobs.filter((j) => j.state === "done").map((j) => j.id).join() !== doneBefore) {
      refreshMedia();   // une vidéo convertie vient d'arriver dans la médiathèque
    }
    if (prev !== JSON.stringify([player?.state, player?.media, player?.gpio])) {
      renderTriggers();
      renderMedia();
    }
  } catch {
    player = null;
    renderStatus();
  }
}

load();
setInterval(poll, 1000);
</script>
